name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.4

jobs:
  release:
    name: Publish exact artifact
    if: github.repository == 'Mark1708/opencode-agents-sidebar'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Validate tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:all
      - run: bun run verify:package
      - name: Record artifact digest
        run: sha256sum .artifacts/package.tgz | tee .artifacts/package.tgz.sha256
      - name: Publish to npm with provenance
        run: |
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          local_sha1=$(sha1sum .artifacts/package.tgz | cut -d' ' -f1)
          registry_sha1=$(npm view "$package@$version" dist.shasum 2>/dev/null || true)
          if [ -n "$registry_sha1" ]; then
            test "$registry_sha1" = "$local_sha1"
            echo "$package@$version already matches the verified artifact"
          else
            npm publish .artifacts/package.tgz --access public --provenance
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" .artifacts/package.tgz .artifacts/package.tgz.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" .artifacts/package.tgz .artifacts/package.tgz.sha256 --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
